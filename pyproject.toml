[project]
name = "voice-agent"
version = "1.0.0"
description = "Terminal daily check-in calls with Twilio, Deepgram, Jessica and Excel storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepgram-sdk>=7.12.0",
    "fastapi>=0.143.0",
    "httpx>=0.28,<1",
    "ngrok>=1.4.0",
    "openpyxl>=3.1.5,<4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.20",
    "twilio>=9,<10",
    "tzdata>=2025.2",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.optional-dependencies]
google-sheets = ["google-auth>=2.40,<3", "requests>=2.32,<3"]
whisper = [
    "openai-whisper",
    "scipy>=1.13,<2",
    "torch>=2.6",
    "webrtcvad-wheels>=2.0.14",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
openai-whisper = { git = "https://github.com/openai/whisper.git", rev = "86098128c0b4f24f0e2aa2994de830614b474227" }
