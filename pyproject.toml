[project]
name = "voice-agent"
version = "1.0.0"
description = "Terminal daily check-in calls with Twilio, Deepgram, Jessica and Excel storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepgram-sdk>=7.12.0",
    "fastapi>=0.143.0",
    "httpx>=0.28,<1",
    "ngrok>=1.4.0",
    "openpyxl>=3.1.5,<4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.20",
    "twilio>=9,<10",
    "tzdata>=2025.2",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.optional-dependencies]
google-sheets = ["google-auth>=2.40,<3", "requests>=2.32,<3"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
